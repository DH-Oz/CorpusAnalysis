[project]
name = "corpusanalysis"
version = "0.1.0"
description = "DH-Oz Corpus Analysis Masterclass — Python/Jupyter lessons (2026 edition)."
readme = "README.md"
requires-python = ">=3.14"

# This is the single source for runtime dependencies. requirements.txt is generated
# from the list below by tools/sync_requirements.py, and environment.yml installs from
# requirements.txt, so a change here reaches the conda path and the Colab path without
# anything being edited by hand. Add a dependency here and nowhere else.
dependencies = [
    # Notebook environment
    "jupyter==1.1.1",
    # Data and plotting
    "numpy==2.4.4",
    "pandas==3.0.5",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    # Interactive plots. The wheel ships a JupyterLab mime renderer, so hover and legend
    # filtering work offline with no second install step, and Colab is detected
    # automatically. Runtime deps are only narwhals and packaging.
    "plotly==6.9.0",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "statsmodels==0.14.6",
    "networkx==3.6.1",
    "wordcloud==1.9.6",
    # Loess smoothing with confidence bands. statsmodels' lowess returns no standard
    # errors, so it cannot draw a band; scikit-misc wraps the loess code R's
    # stats::loess() calls, which does.
    "scikit-misc==0.5.2",
    # Text and corpus
    # 3.10.0 hardens resource loading against path traversal and SSRF, and blocks XML
    # entity expansion. nltk.download() is the one thing this course pulls over the
    # network onto student machines, so the hardening is worth having.
    "nltk==3.10.0",
    "liwc==0.5.0",
    "sotu==0.1.2",
]

[dependency-groups]
# Instructor-side only. These never reach requirements.txt, so a student install
# stays as small as it can be.
dev = [
    "python-pptx>=1.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
]
