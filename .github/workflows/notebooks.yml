name: notebooks

# Every code-along notebook must execute top to bottom with no errors, because a
# student runs them exactly that way with an instructor watching.

on:
  push:
    paths:
      - "*.ipynb"
      - "corpus_tools.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "dictionaries/**"
      - "nietzsche/**"
      - ".github/workflows/notebooks.yml"
  pull_request:
  workflow_dispatch:

jobs:
  execute:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            expect: Linux
          - os: macos-latest
            label: macOS (Apple Silicon)
            expect: Darwin
          - os: windows-latest
            label: Windows
            expect: Windows
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync

      - name: Assert this leg really is ${{ matrix.label }}
        run: uv run python tools/report_environment.py --expect-system ${{ matrix.expect }}

      - name: Set the LIWC dictionary aside
        # Notebook 2 asks for the resources.zip password with input(), which is right
        # in a room with an instructor and impossible in a headless run. Moving the zip
        # away sends that cell down its "not found" branch, so CI proves the notebook
        # degrades gracefully for a student who has not unzipped it.
        #
        # The extraction itself is therefore NOT covered here. Covering it would mean
        # putting the password in this file, and the password never goes in the repo.
        run: mv resources.zip ../resources.zip.hidden

      - name: Execute every notebook and fail on any error
        run: |
          # A workspace-relative directory, because Git Bash rewrites /tmp when it
          # hands the path to nbconvert while Python's pathlib does not, so the two
          # halves of this job disagreed about where the notebooks were on Windows.
          mkdir -p executed
          status=0
          for notebook in [0-9]*.ipynb; do
            echo "::group::$notebook"
            if uv run jupyter nbconvert --to notebook --execute "$notebook" \
                 --output-dir executed --output "$notebook"; then
              echo "$notebook ran clean"
            else
              echo "::error file=$notebook::$notebook failed to execute"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Confirm the figures were actually produced
        # Distinguishes "the notebooks drew nothing" from "this check looked in the
        # wrong place", which reported an identical zero on Windows before the fix.
        run: uv run python tools/check_executed_figures.py executed --min-figures 40

      - name: Keep the executed notebooks for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks-${{ matrix.os }}
          path: executed/
          retention-days: 7
