name: notebooks

# Every code-along notebook must execute top to bottom with no errors, because a
# student runs them exactly that way with an instructor watching.

on:
  push:
    paths:
      - "*.ipynb"
      - "corpus_tools.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "dictionaries/**"
      - "nietzsche/**"
      - ".github/workflows/notebooks.yml"
  pull_request:
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync

      - name: Set the LIWC dictionary aside
        # Notebook 2 asks for the resources.zip password with input(), which is right
        # in a room with an instructor and impossible in a headless run. Moving the zip
        # away sends that cell down its "not found" branch, so CI proves the notebook
        # degrades gracefully for a student who has not unzipped it.
        #
        # The extraction itself is therefore NOT covered here. Covering it would mean
        # putting the password in this file, and the password never goes in the repo.
        run: mv resources.zip /tmp/resources.zip

      - name: Execute every notebook and fail on any error
        run: |
          mkdir -p /tmp/executed
          status=0
          for notebook in [0-9]*.ipynb; do
            echo "::group::$notebook"
            if uv run jupyter nbconvert --to notebook --execute "$notebook" \
                 --output-dir /tmp/executed --output "$notebook"; then
              echo "$notebook ran clean"
            else
              echo "::error file=$notebook::$notebook failed to execute"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Confirm the figures were actually produced
        # A notebook can exit zero while silently drawing nothing, so count the images
        # rather than trusting the exit code.
        run: |
          uv run python - <<'PY'
          import json, pathlib, sys
          figures = 0
          for path in sorted(pathlib.Path('/tmp/executed').glob('*.ipynb')):
              nb = json.loads(path.read_text())
              count = sum(
                  1
                  for cell in nb['cells']
                  for output in cell.get('outputs', [])
                  if 'image/png' in output.get('data', {})
              )
              print(f'  {path.name}: {count} figures')
              figures += count
          print(f'{figures} figures in total')
          # With everything present the course draws 51. CI hides resources.zip, so the
          # six LIWC emotion plots are skipped and 45 is the expected number here.
          # The floor is lower than that so a single reordered cell is not a failure,
          # while a subsystem quietly rendering nothing still is.
          if figures < 40:
              sys.exit(f'Only {figures} figures, expected 45 with LIWC skipped.')
          PY

      - name: Keep the executed notebooks for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: /tmp/executed/
          retention-days: 7
