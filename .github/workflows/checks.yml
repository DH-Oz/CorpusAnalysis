name: checks

# The fast gate. It runs on every platform a student might be on, because neither
# instructor uses Windows or macOS and a platform bug would otherwise reach the room
# before it reached us. The dictionary encoding tests are the reason this is a matrix
# rather than one Linux job.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            expect: Linux
            primary: true
          - os: macos-latest
            label: macOS (Apple Silicon)
            expect: Darwin
          - os: macos-15-intel
            label: macOS (Intel)
            expect: Darwin
          - os: windows-latest
            label: Windows
            expect: Windows
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync

      - name: Assert this leg really is ${{ matrix.label }}
        # A matrix label is a claim until the leg checks it. sotu's CI advertised five
        # Python versions while running one, for five releases, because nothing made
        # the leg prove where it was. See .notes/feedback_verify-what-a-check-could-not-see.md
        run: uv run python tools/report_environment.py --expect-system ${{ matrix.expect }}

      - name: Unit tests
        run: uv run pytest -q

      - name: requirements.txt matches pyproject.toml
        if: matrix.primary
        run: uv run python tools/sync_requirements.py --check

      - name: Every dependency ships a prebuilt wheel
        # Reads PyPI, so once is enough. Its answer does not vary by runner.
        if: matrix.primary
        run: uv run python tools/check_wheels.py

      - name: Notebooks explain in markdown, not in comment blocks
        if: matrix.primary
        run: uv run python tools/check_markdown_convention.py

      - name: Notebooks carry the outputs of one clean run
        # The committed notebooks are read without being run, so their stored
        # outputs are the thing a reader trusts. They drifted to 2-of-23 executed
        # before anything checked, because replacing a cell drops its outputs.
        if: matrix.primary
        run: uv run python tools/check_outputs.py

      - name: Every Python construct is explained before a learner meets it
        # .notes/feedback_no-unearned-python-idioms.md, which had nothing enforcing
        # it until a cell-by-cell read found it broken in four places at once:
        # .iloc, enumerate, f-string format specs, and three ternaries.
        if: matrix.primary
        run: uv run python tools/check_taught_idioms.py

      - name: One plot type, one library
        # A student should not have to learn two APIs to read the same kind of
        # picture twice. Scatters are seaborn; networks, clouds and dispersion
        # plots are matplotlib and networkx.
        if: matrix.primary
        run: uv run python tools/check_plot_libraries.py
