name: student-path

# What a student actually does: download the folder, start one file, and end up in
# JupyterLab. Nothing else in CI covers that, because everything else starts from a
# working uv environment the student will never have.
#
# Invoke the launcher exactly as the README teaches it. Windows double-clicks the
# .bat; macOS and Linux run `sh start-jupyter.sh`, which is what walks around
# Gatekeeper, because a script read by sh is never launched and so is never checked.
#
# What this workflow cannot see: Gatekeeper itself. It fires on the quarantine
# attribute a browser sets and on a Finder double-click, and a CI checkout has
# neither. A green run here says the launcher works, never that a downloaded copy
# opens. That gap is why the .command double-click path reached students broken.
#
# The launchers set COURSE_LAUNCHER_SELFTEST here so they check JupyterLab runs and
# then exit, instead of leaving a server up until the job times out.

on:
  push:
    paths:
      - "start-jupyter.sh"
      - "start-jupyter.bat"
      - "environment.yml"
      - "requirements.txt"
      - ".github/workflows/student-path.yml"
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, because this path breaks from the outside. Miniforge moves, conda-forge
    # drops a Python build, a wheel is yanked. None of that shows up in a diff.
    - cron: "0 17 * * 0"

jobs:
  from-nothing:
    # The hardest case and the one most like a student laptop: no conda anywhere.
    name: install from nothing (no conda on the machine)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: debian:stable-slim
    steps:
      - name: Tools the base image lacks
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates git

      - uses: actions/checkout@v5

      - name: Confirm the machine really has no conda
        run: |
          if command -v conda >/dev/null 2>&1; then
            echo "This image already has conda, so the test proves nothing."
            exit 1
          fi
          echo "No conda present, which is the case we want to test."

      - name: The launcher is committed executable
        run: |
          # Not a chmod. Students are taught `sh start-jupyter.sh`, which runs with or
          # without the bit, so a mode lost in a commit would never surface below.
          test -x start-jupyter.sh || { echo "start-jupyter.sh is not executable in git"; exit 1; }
          echo "Committed executable, so ./start-jupyter.sh works too."

      - name: Decline the install, and check nothing was installed
        run: |
          echo "n" | sh start-jupyter.sh > decline.log 2>&1 || true
          grep -q "Nothing was installed" decline.log
          test ! -d "$HOME/miniforge3"
          echo "Declining leaves the machine untouched."

      - name: Accept, install Miniforge, build the environment, reach JupyterLab
        env:
          COURSE_LAUNCHER_SELFTEST: "1"
        run: |
          echo "y" | sh start-jupyter.sh
          test -d "$HOME/miniforge3"

      - name: The install stayed in userland and left the shell alone
        run: |
          test -d "$HOME/miniforge3" || { echo "Miniforge is not in HOME"; exit 1; }
          for profile in "$HOME/.bashrc" "$HOME/.bash_profile" "$HOME/.profile" "$HOME/.zshrc"; do
            if [ -f "$profile" ] && grep -q "conda initialize" "$profile"; then
              echo "$profile was modified, which the launcher promised not to do."
              exit 1
            fi
          done
          echo "One folder added, no shell profile touched."

  native:
    # The platforms students are actually on. GitHub's runners keep conda somewhere the
    # launcher does not look, so these also exercise the install path, on real macOS
    # and real Windows rather than in a container.
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            launcher: bash
          - os: macos-15-intel
            label: macOS (Intel)
            launcher: bash
          - os: windows-latest
            label: Windows
            launcher: batch
    steps:
      - uses: actions/checkout@v5

      - name: Run the launcher
        if: matrix.launcher == 'bash'
        env:
          COURSE_LAUNCHER_SELFTEST: "1"
        run: |
          echo "y" | sh start-jupyter.sh

      - name: Run the launcher
        if: matrix.launcher == 'batch'
        shell: cmd
        env:
          COURSE_LAUNCHER_SELFTEST: "1"
        run: echo y | start-jupyter.bat
